<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizador Epysur Pro</title>
    <style>
        :root { --rojo: #A61F1F; --fondo: #f4f7f6; --texto: #333; --blanco: #ffffff; }

        @page { size: letter; margin: 1.5cm; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--fondo); color: var(--texto); margin: 0; padding: 0;
            display: flex; justify-content: center;
        }

        .page-container {
            width: 100%; max-width: 800px; background: var(--blanco);
            min-height: 100vh; padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; padding-bottom: 100px;
        }

        /* Header */
        .header {
            border-bottom: 3px solid var(--rojo); padding-bottom: 15px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 50px; width: auto; }
        .logo-text h1 { color: var(--rojo); margin: 0; font-size: 22px; font-weight: 900; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .input-group input, .input-group textarea {
            width: 100%; border: 1px solid #ddd; background: #fdfdfd;
            padding: 12px; font-size: 16px; border-radius: 8px; box-sizing: border-box;
        }

        /* VISTA CELULAR (Tarjetas) */
        .item-card {
            background: #fff; border: 1px solid #eee; border-radius: 12px;
            padding: 15px; margin-bottom: 15px; position: relative;
        }
        .item-card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .row-total-box {
            grid-column: span 2; text-align: right; border-top: 1px dashed #eee;
            padding-top: 10px; font-weight: 800; color: var(--rojo); font-size: 18px;
        }
        .btn-delete {
            position: absolute; top: -10px; right: -10px; background: #000; color: #fff;
            border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }

        /* VISTA IMPRESIÓN (Tabla oculta en pantalla) */
        .print-table { display: none; width: 100%; border-collapse: collapse; margin: 20px 0; }
        .print-table th { background: var(--rojo); color: white; padding: 8pt; text-align: left; font-size: 10pt; }
        .print-table td { padding: 8pt; border-bottom: 1px solid #eee; font-size: 10pt; vertical-align: top; }

        /* Resumen */
        .summary-box { background: #222; color: #fff; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .summary-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; font-size: 20px; font-weight: 900; }

        .app-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 15px; display: flex; gap: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; }
        .btn-pdf { background: var(--rojo); color: #fff; }
        .btn-clear { background: #eee; color: #666; }
        .btn-add { background: #f4f4f4; border: 2px dashed #ccc; color: #666; margin-top: 10px; width: 100%; padding: 15px; border-radius: 10px; }

        @media (min-width: 768px) {
            .page-container { margin: 30px; border-radius: 15px; padding: 50px; height: auto; }
            .header { flex-direction: row; align-items: flex-end; }
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .app-bar { position: static; box-shadow: none; padding: 20px 0; }
        }

        /* --- MAGIA PARA LA IMPRESIÓN --- */
        @media print {
            html, body { height: auto; background: #fff; margin: 0 !important; }
            .page-container { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
            .app-bar, .btn-add, .btn-delete, #items-container { display: none !important; }
            
            /* Mostramos la tabla solo al imprimir */
            .print-table { display: table !important; }
            .summary-box { background: transparent !important; color: #000 !important; border: 1px solid #eee; break-inside: avoid; }
            .summary-total { color: var(--rojo) !important; border-top: 2px solid var(--rojo) !important; }
            .summary-line { color: #000 !important; }
            
            input, textarea { border: none !important; background: transparent !important; padding: 2px 0 !important; font-size: 10pt !important; }
            .logo-img { height: 60pt !important; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="header">
        <div class="logo-box">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">
                <h1>EPYSUR</h1>
                <p style="margin:0; font-size: 8px; color: #888;">SOLUCIONES PARA TU HOGAR</p>
            </div>
        </div>
        <div class="input-group" style="margin-left: auto;">
            <label>Cotización N°</label>
            <input type="text" id="n-cotiz" placeholder="2026-001" style="font-weight: 900; color: var(--rojo); text-align: right; width: 120px;">
        </div>
    </div>

    <div class="grid-2">
        <div class="input-group"><label>Cliente</label><input type="text" class="clearable"></div>
        <div class="input-group"><label>RUT</label><input type="text" class="clearable" oninput="formatearRut(this)"></div>
        <div class="input-group"><label>Fecha</label><input type="date" id="fecha"></div>
        <div class="input-group"><label>Dirección</label><input type="text" class="clearable"></div>
    </div>

    <!-- Contenedor de Tarjetas (Solo Celular/PC) -->
    <div id="items-container"></div>
    <button class="btn-add" onclick="agregarFila()">+ AGREGAR ITEM</button>

    <!-- Tabla Escondida (Solo para el PDF) -->
    <table class="print-table" id="tabla-pdf">
        <thead>
            <tr>
                <th style="width: 50%;">Descripción</th>
                <th style="width: 10%; text-align: center;">Cant.</th>
                <th style="width: 20%; text-align: right;">Neto Unit.</th>
                <th style="width: 20%; text-align: right;">Total</th>
            </tr>
        </thead>
        <tbody id="tabla-pdf-body"></tbody>
    </table>

    <div class="summary-box">
        <div class="summary-line"><span>Subtotal Neto:</span><span id="res-neto">$0</span></div>
        <div class="summary-line"><span>IVA (19%):</span><span id="res-iva">$0</span></div>
        <div class="summary-total"><span>TOTAL:</span><span id="res-total">$0</span></div>
    </div>

    <div style="margin-top: 20px;">
        <div class="input-group"><label>Forma de Pago</label><input type="text" class="clearable" placeholder="Transferencia"></div>
        <div class="input-group"><label>Observaciones</label><textarea class="clearable" oninput="autoExpand(this)"></textarea></div>
    </div>

    <div style="text-align: center; color: #bbb; font-size: 10px; margin-top: 30px;">Válido por 15 días.</div>
</div>

<div class="app-bar">
    <button class="btn btn-clear" onclick="limpiarTodo()">Limpiar</button>
    <button class="btn btn-pdf" onclick="prepararYImprimir()">Descargar PDF</button>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    function autoExpand(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    function formatearRut(i) {
        let v = i.value.replace(/\./g, '').replace(/-/g, '');
        if (v.length < 2) return;
        let c = v.slice(0, -1).slice(0, 8);
        let d = v.slice(-1).toUpperCase();
        i.value = c.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + d;
    }

    function agregarFila() {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
            <div class="input-group"><label>Descripción</label><textarea rows="2" class="desc clearable" oninput="autoExpand(this)"></textarea></div>
            <div class="item-card-row">
                <div class="input-group"><label>Cant.</label><input type="number" class="qty" value="1" oninput="calcular()"></div>
                <div class="input-group"><label>Precio</label><input type="number" class="price" value="0" oninput="calcular()"></div>
            </div>
            <div class="row-total-box">Total: $0</div>
            <button class="btn-delete" onclick="this.parentElement.remove(); calcular();">✕</button>`;
        document.getElementById('items-container').appendChild(div);
    }

    function calcular() {
        let neto = 0;
        document.querySelectorAll('.item-card').forEach(card => {
            const q = parseFloat(card.querySelector('.qty').value) || 0;
            const p = parseFloat(card.querySelector('.price').value) || 0;
            const sub = Math.round(q * p);
            card.querySelector('.row-total-box').innerText = "Total: $" + sub.toLocaleString('es-CL');
            neto += sub;
        });
        document.getElementById('res-neto').innerText = "$" + neto.toLocaleString('es-CL');
        document.getElementById('res-iva').innerText = "$" + Math.round(neto * 0.19).toLocaleString('es-CL');
        document.getElementById('res-total').innerText = "$" + Math.round(neto * 1.19).toLocaleString('es-CL');
    }

    function prepararYImprimir() {
        const pdfBody = document.getElementById('tabla-pdf-body');
        pdfBody.innerHTML = '';
        document.querySelectorAll('.item-card').forEach(card => {
            const desc = card.querySelector('.desc').value;
            const qty = card.querySelector('.qty').value;
            const price = parseFloat(card.querySelector('.price').value) || 0;
            const total = Math.round(qty * price);
            pdfBody.innerHTML += `<tr>
                <td>${desc.replace(/\n/g, '<br>')}</td>
                <td style="text-align:center;">${qty}</td>
                <td style="text-align:right;">$${price.toLocaleString('es-CL')}</td>
                <td style="text-align:right; font-weight:bold;">$${total.toLocaleString('es-CL')}</td>
            </tr>`;
        });
        window.print();
    }

    function limpiarTodo() {
        if (confirm("¿Borrar todo?")) {
            document.querySelectorAll('.clearable').forEach(e => e.value = '');
            document.getElementById('items-container').innerHTML = '';
            agregarFila(); calcular();
        }
    }

    agregarFila(); // Iniciar con una fila
</script>
</body>
</html>
