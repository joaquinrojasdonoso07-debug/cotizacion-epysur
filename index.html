<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizador Epysur - Factura</title>
    <style>
        :root { --rojo: #A61F1F; --texto: #333; --gris-soft: #fcfcfc; }
        @page { size: letter; margin: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #555; color: var(--texto); margin: 0; padding: 0;
            display: flex; justify-content: center;
        }

        .page-container {
            width: 100%; max-width: 8.5in; background: white;
            min-height: 11in; padding: 45pt; box-sizing: border-box;
            display: flex; flex-direction: column; position: relative;
        }

        /* --- CABECERA --- */
        .header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid var(--rojo); padding-bottom: 12pt; margin-bottom: 25pt;
        }
        .logo-section { display: flex; align-items: center; gap: 15pt; }
        .logo-img { height: 50pt; width: auto; }
        .logo-text h1 { color: var(--rojo); margin: 0; font-size: 22pt; font-weight: 900; line-height: 0.9; }
        .logo-text p { margin: 0; font-size: 8pt; letter-spacing: 1.5px; color: #666; font-weight: bold; }

        .cotizacion-id { text-align: right; }
        .cotizacion-id label { display: block; font-size: 7.5pt; font-weight: bold; color: #888; margin-bottom: 2pt; }
        .cotizacion-id input { 
            font-size: 13pt; font-weight: bold; color: #000; 
            text-align: right; border: none; background: transparent; width: 130px; outline: none;
        }

        /* --- INFO CLIENTE --- */
        .info-block { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40pt; margin-bottom: 25pt; }
        .input-group { margin-bottom: 12pt; }
        .input-group label { display: block; font-size: 7pt; font-weight: 800; color: #999; text-transform: uppercase; margin-bottom: 4pt; }
        .input-group input { 
            width: 100%; border: none; border-bottom: 1px solid #eee; background: var(--gris-soft); 
            padding: 5pt; font-size: 10pt; box-sizing: border-box; outline: none;
        }

        /* --- TABLA --- */
        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 25pt; }
        .items-table th { color: #aaa; padding: 10pt 8pt; text-align: left; font-size: 7.5pt; text-transform: uppercase; border-bottom: 1px solid #eee; }
        .items-table td { padding: 12pt 8pt; border-bottom: 1px solid #f9f9f9; vertical-align: top; }
        
        .desc-cell textarea { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 10pt; resize: none; overflow: hidden; outline: none; }
        
        /* Ocultar flechas */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- PIE --- */
        .footer-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 30pt; margin-top: auto; }

        .summary-table { width: 100%; border-top: 2px solid #333; padding-top: 10pt; }
        .summary-row { display: flex; justify-content: space-between; padding: 3pt 0; font-size: 9.5pt; color: #444; }
        .total-row { color: var(--rojo); font-weight: 900; font-size: 17pt; margin-top: 5pt; }

        .obs-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15pt; }
        .obs-full { grid-column: span 2; margin-top: 15pt; border-top: 1px solid #eee; padding-top: 10pt; }
        .obs-full textarea { width: 100%; border: none; font-size: 9pt; background: transparent; resize: none; outline: none; min-height: 50pt; line-height: 1.4; }
        .char-count { font-size: 7pt; color: #ddd; text-align: right; }

        /* --- BOTONES --- */
        .app-controls { position: fixed; bottom: 20pt; display: flex; gap: 10pt; z-index: 1000; }
        .btn { padding: 12pt 30pt; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4pt 10pt rgba(0,0,0,0.15); text-transform: uppercase; letter-spacing: 1px; }
        .btn-pdf { background: var(--rojo); color: white; }
        .btn-clear { background: #222; color: white; }
        .btn-add { background: #fdfdfd; border: 1px dashed #ddd; width: 100%; padding: 10pt; cursor: pointer; margin-bottom: 20pt; font-size: 8pt; color: #bbb; border-radius: 4px; }

        /* --- PRINT OVERRIDE --- */
        @media print {
            body { background: white; }
            .page-container { box-shadow: none; padding: 45pt; height: 11in; width: 8.5in; }
            .app-controls, .btn-add, .btn-del, .char-count { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; padding: 0 !important; color: black !important; }
            input[type="date"]::-webkit-calendar-picker-indicator { display: none; -webkit-appearance: none; }
            .items-table th { color: #777 !important; border-bottom: 1px solid #333 !important; }
            .summary-table { border-top: 2px solid var(--rojo) !important; }
            .legal-footer { position: absolute; bottom: 45pt; left: 45pt; right: 45pt; text-align: center; font-size: 7.5pt; color: #bbb; border-top: 1px solid #eee; padding-top: 10pt; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="header">
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">
                <h1>EPYSUR</h1>
                <p>SOLUCIONES PARA TUI HOGAR</p>
            </div>
        </div>
        <div class="cotizacion-id">
            <label>COTIZACIÓN N°</label>
            <input type="text" placeholder="Ej: 2026-001">
        </div>
    </div>

    <div class="info-block">
        <div>
            <div class="input-group"><label>Nombre / Razón Social</label><input type="text" class="clear"></div>
            <div class="input-group"><label>RUT Cliente</label><input type="text" class="clear" oninput="fR(this)"></div>
        </div>
        <div>
            <div class="input-group"><label>Fecha de Emisión</label><input type="date" id="f-e"></div>
            <div class="input-group"><label>Dirección de Servicio</label><input type="text" class="clear"></div>
        </div>
    </div>

    <table class="items-table" id="t-i">
        <thead>
            <tr>
                <th style="width: 55%;">Descripción del Servicio</th>
                <th style="width: 10%; text-align: center;">Cant.</th>
                <th style="width: 15%; text-align: right;">Neto Unit.</th>
                <th style="width: 20%; text-align: right;">Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="desc-cell"><textarea class="clear" rows="1" oninput="aS(this)" placeholder="Indique el servicio prestado..."></textarea></td>
                <td><input type="number" class="qty" value="1" oninput="up()"></td>
                <td><input type="number" class="price" value="0" oninput="up()" style="text-align:right;"></td>
                <td class="row-t" style="text-align:right; font-weight:bold; font-size: 10.5pt;">$0</td>
            </tr>
        </tbody>
    </table>
    <button class="btn-add" onclick="aR()">+ AGREGAR NUEVO ÍTEM</button>

    <div class="footer-grid">
        <div class="obs-section">
            <div class="input-group"><label>Forma de Pago</label><input type="text" class="clear" value="Transferencia"></div>
            <div class="input-group"><label>Validez Oferta</label><input type="text" class="clear" value="15 días"></div>
            <div class="obs-full">
                <label>Observaciones y Notas</label>
                <textarea id="o-t" class="clear" maxlength="200" oninput="cC(this)" placeholder="Notas adicionales..."></textarea>
                <div class="char-count"><span id="c-n">0</span> / 200</div>
            </div>
        </div>
        
        <div class="summary-section">
            <div class="summary-table">
                <div class="summary-row"><span>Monto Neto:</span><span id="n-n">$0</span></div>
                <div class="summary-row"><span>IVA (19%):</span><span id="n-i">$0</span></div>
                <div class="summary-row total-row"><span>TOTAL:</span><span id="n-t">$0</span></div>
            </div>
        </div>
    </div>

    <div class="legal-footer">Este documento es una cotización informativa y no representa una factura legal electrónica.</div>
</div>

<div class="app-controls">
    <button class="btn btn-clear" onclick="location.reload()">Limpiar Datos</button>
    <button class="btn btn-pdf" onclick="window.print()">Imprimir Factura</button>
</div>

<script>
    document.getElementById('f-e').valueAsDate = new Date();
    function aS(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    function cC(t) { document.getElementById('c-n').innerText = t.value.length; }
    function fR(i) {
        let v = i.value.replace(/\./g, '').replace(/-/g, '');
        if (v.length < 2) return;
        let c = v.slice(0, -1).slice(0, 8);
        let d = v.slice(-1).toUpperCase();
        i.value = c.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + d;
    }
    function aR() {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="desc-cell"><textarea class="clear" rows="1" oninput="aS(this)"></textarea></td>
            <td><input type="number" class="qty" value="1" oninput="up()" style="text-align:center; border:none; background:transparent;"></td>
            <td><input type="number" class="price" value="0" oninput="up()" style="text-align:right; border:none; background:transparent;"></td>
            <td class="row-t" style="text-align:right; font-weight:bold; font-size: 10.5pt;">$0</td>`;
        document.querySelector('#t-i tbody').appendChild(tr);
    }
    function up() {
        let n = 0;
        document.querySelectorAll('#t-i tbody tr').forEach(r => {
            const q = parseFloat(r.querySelector('.qty').value) || 0;
            const p = parseFloat(r.querySelector('.price').value) || 0;
            const s = Math.round(q * p);
            r.querySelector('.row-t').innerText = "$" + s.toLocaleString('es-CL');
            n += s;
        });
        document.getElementById('n-n').innerText = "$" + n.toLocaleString('es-CL');
        document.getElementById('n-i').innerText = "$" + Math.round(n * 0.19).toLocaleString('es-CL');
        document.getElementById('n-t').innerText = "$" + Math.round(n * 1.19).toLocaleString('es-CL');
    }
</script>
</body>
</html>
