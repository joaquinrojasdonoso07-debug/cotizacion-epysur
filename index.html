<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Epysur - Profesional</title>
    <style>
        @page { size: letter; margin: 1cm; }
        :root { --rojo-epysur: #A61F1F; --gris-claro: #fcfcfc; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #555;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }

        .page-container {
            width: 100%; max-width: 8.5in;
            background: white;
            padding: 40pt;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            min-height: 11in;
            display: flex; flex-direction: column;
        }

        .header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 3px solid var(--rojo-epysur);
            padding-bottom: 10pt; margin-bottom: 20pt;
        }

        .logo-img { height: 55pt; width: auto; }
        .logo-text h1 { color: var(--rojo-epysur); margin: 0; font-size: 22pt; font-weight: 900; }
        
        .input-group { margin-bottom: 10pt; }
        .input-group label {
            display: block; font-size: 8pt; font-weight: bold; color: #555;
            text-transform: uppercase; margin-bottom: 2pt;
        }
        
        .input-group input, .input-group textarea {
            width: 100%; border: 1px solid #eee; background: var(--gris-claro);
            padding: 6pt; font-size: 10pt; font-family: inherit; border-radius: 4px; box-sizing: border-box;
        }

        /* --- ELIMINAR FLECHAS DE NÚMEROS --- */
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        tr { break-inside: avoid; }
        .table-responsive { width: 100%; margin-top: 10pt; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--rojo-epysur); color: white; padding: 10pt; font-size: 9pt; text-align: left; }
        td { padding: 8pt; border-bottom: 1px solid #eee; vertical-align: top; }

        .no-break { break-inside: avoid; margin-top: 20pt; }

        .summary { 
            margin-left: auto; width: 220pt; 
            background: #f9f9f9; padding: 10pt; border-radius: 5px; 
        }
        .summary-row { display: flex; justify-content: space-between; padding: 4pt 0; font-size: 10pt; }
        .total-row { border-top: 2px solid var(--rojo-epysur); color: var(--rojo-epysur); font-weight: bold; font-size: 15pt; padding-top: 8pt; }

        .condiciones-stack {
            display: flex; flex-direction: column; gap: 8pt;
            border-top: 1px solid #eee; padding-top: 15pt;
        }

        .footer-note {
            text-align: center; font-size: 8pt; color: #aaa;
            padding: 40pt 0 10pt 0; margin-top: auto;
        }

        .app-controls { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; display: flex; gap: 10pt;
        }
        
        .btn {
            background: var(--rojo-epysur); color: white; padding: 10pt 25pt;
            border: none; border-radius: 50pt; font-weight: bold; cursor: pointer;
            box-shadow: 0 4pt 15pt rgba(0,0,0,0.4); font-size: 10pt;
        }

        .btn-secondary { background: #444; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 5pt 8pt; border-radius: 4px; cursor: pointer; }

        @media print {
            body { background: white; padding: 0; }
            .page-container { box-shadow: none; max-width: 100%; width: 100%; padding: 0; }
            .app-controls, .btn-add, .btn-delete { display: none !important; }
            .input-group input, .input-group textarea { border: none; background: transparent; padding: 2pt 0; }
            .header, th, .total-row { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 10pt;">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">
                <h1>EPYSUR.CL</h1>
                <p style="margin:0; font-size: 8pt; letter-spacing: 1px; color: #666;">SOLUCIONES DE CALEFACCIÓN</p>
            </div>
        </div>
        <div class="input-group" style="text-align: right;">
            <label>Cotización N°</label>
            <input type="text" id="n-cotizacion" placeholder="Ej: 2026-001" style="text-align: right; width: 150px; font-weight: bold; color: var(--rojo-epysur);">
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; margin-bottom: 20pt;">
        <div>
            <div class="input-group"><label>Nombre / Razón Social</label><input type="text" class="clearable"></div>
            <div class="input-group"><label>RUT</label><input type="text" class="clearable" oninput="formatearRut(this)"></div>
        </div>
        <div>
            <div class="input-group"><label>Fecha</label><input type="date" id="fecha"></div>
            <div class="input-group"><label>Dirección y Comuna</label><input type="text" class="clearable"></div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="tabla-items">
            <thead>
                <tr>
                    <th style="width: 50%;">Descripción</th>
                    <th style="text-align:center; width: 10%;">Cant.</th>
                    <th style="text-align:right; width: 15%;">Unitario</th>
                    <th style="text-align:right; width: 20%;">Total</th>
                    <th style="width: 5%;"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><textarea oninput="autoExpand(this)" placeholder="Descripción..." style="border:none; width:100%; background:transparent; resize:none;" class="clearable"></textarea></td>
                    <td><input type="number" class="qty" value="1" oninput="calcular()" style="text-align:center;"></td>
                    <td><input type="number" class="price" value="0" oninput="calcular()" style="text-align:right;"></td>
                    <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
                    <td style="text-align:center;"><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-add" onclick="agregarFila()" style="width:100%; margin-top:10pt; background:#f0f0f0; border:1px dashed #999; padding:10pt; cursor:pointer; font-weight:bold;">+ AGREGAR ITEM</button>

    <div class="no-break">
        <div class="summary">
            <div class="summary-row"><span>Subtotal Neto:</span><span id="res-neto">$0</span></div>
            <div class="summary-row"><span>IVA (19%):</span><span id="res-iva">$0</span></div>
            <div class="summary-row total-row"><span>TOTAL:</span><span id="res-total">$0</span></div>
        </div>

        <div class="condiciones-stack">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10pt;">
                <div class="input-group"><label>Forma de Pago</label><input type="text" placeholder="Transferencia" class="clearable"></div>
                <div class="input-group"><label>Validez</label><input type="text" value="15 días" class="clearable"></div>
            </div>
            <div class="input-group">
                <label>Observaciones</label>
                <textarea oninput="autoExpand(this)" placeholder="Notas adicionales..." maxlength="1200" class="clearable"></textarea>
            </div>
        </div>
    </div>

    <div class="footer-note">
        Este documento es una cotización informativa y no representa una factura legal.
    </div>
</div>

<div class="app-controls">
    <button class="btn btn-secondary" onclick="limpiarTodo()">LIMPIAR TODO</button>
    <button class="btn" onclick="window.print()">DESCARGAR PDF</button>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    function autoExpand(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function formatearRut(input) {
        let valor = input.value.replace(/\./g, '').replace(/-/g, '');
        if (valor.length < 2) return;
        let cuerpo = valor.slice(0, -1).slice(0, 8);
        let dv = valor.slice(-1).toUpperCase();
        input.value = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
    }

    function agregarFila() {
        const table = document.getElementById("tabla-items").getElementsByTagName('tbody')[0];
        const row = table.insertRow();
        row.innerHTML = `
            <td><textarea oninput="autoExpand(this)" placeholder="..." style="border:none; width:100%; background:transparent; resize:none;" class="clearable"></textarea></td>
            <td><input type="number" class="qty" value="1" oninput="calcular()" style="text-align:center;"></td>
            <td><input type="number" class="price" value="0" oninput="calcular()" style="text-align:right;"></td>
            <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
            <td style="text-align:center;"><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
        `;
    }

    function eliminarFila(btn) {
        if (document.querySelectorAll("#tabla-items tbody tr").length > 1) {
            btn.closest('tr').remove();
            calcular();
        }
    }

    function calcular() {
        let netoAcumulado = 0;
        document.querySelectorAll("#tabla-items tbody tr").forEach(r => {
            const q = parseFloat(r.querySelector(".qty").value) || 0;
            const p = parseFloat(r.querySelector(".price").value) || 0;
            const subtotal = Math.round(q * p);
            r.querySelector(".row-total").innerText = "$" + subtotal.toLocaleString('es-CL');
            netoAcumulado += subtotal;
        });
        const ivaTotal = Math.round(netoAcumulado * 0.19);
        document.getElementById("res-neto").innerText = "$" + netoAcumulado.toLocaleString('es-CL');
        document.getElementById("res-iva").innerText = "$" + ivaTotal.toLocaleString('es-CL');
        document.getElementById("res-total").innerText = "$" + (netoAcumulado + ivaTotal).toLocaleString('es-CL');
    }

    function limpiarTodo() {
        if (confirm("¿Borrar todos los datos?")) {
            document.querySelectorAll('.clearable').forEach(el => {
                el.value = '';
                if(el.tagName === 'TEXTAREA') el.style.height = 'auto';
            });
            document.getElementById('n-cotizacion').value = '';
            document.getElementById('fecha').valueAsDate = new Date();
            const tbody = document.querySelector("#tabla-items tbody");
            tbody.innerHTML = `
                <tr>
                    <td><textarea oninput="autoExpand(this)" placeholder="Descripción..." style="border:none; width:100%; background:transparent; resize:none;" class="clearable"></textarea></td>
                    <td><input type="number" class="qty" value="1" oninput="calcular()" style="text-align:center;"></td>
                    <td><input type="number" class="price" value="0" oninput="calcular()" style="text-align:right;"></td>
                    <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
                    <td style="text-align:center;"><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
                </tr>
            `;
            calcular();
        }
    }
</script>
</body>
</html>
