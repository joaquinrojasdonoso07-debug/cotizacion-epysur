<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Epysur - Mobile Friendly</title>
    <style>
        @page { size: letter; margin: 1cm; }
        :root { --rojo-epysur: #A61F1F; --gris-claro: #fcfcfc; --borde: #eee; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;
            margin: 0; padding: 0;
            display: flex; justify-content: center;
        }

        /* Contenedor principal adaptable */
        .page-container {
            width: 100%;
            max-width: 8.5in;
            background: white;
            padding: 20px; /* Padding reducido para móviles */
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-bottom: 3px solid var(--rojo-epysur);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 45pt; width: auto; }
        .logo-text h1 { color: var(--rojo-epysur); margin: 0; font-size: 18pt; font-weight: 900; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label {
            display: block; font-size: 7.5pt; font-weight: bold; color: #666;
            text-transform: uppercase; margin-bottom: 4px;
        }
        
        .input-group input, .input-group textarea {
            width: 100%; border: 1px solid #ddd; background: var(--gris-claro);
            padding: 10px; font-size: 16px; /* 16px evita el zoom automático en iPhone */
            font-family: inherit; border-radius: 6px; box-sizing: border-box;
        }

        /* Ocultar flechas de números */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- MANEJO DE TABLA RESPONSIVE --- */
        .table-responsive { width: 100%; margin-top: 10pt; }
        table { width: 100%; border-collapse: collapse; }
        
        /* En móviles, ocultamos el encabezado de la tabla */
        thead { display: none; }
        
        /* Convertimos cada fila en una "tarjeta" en el celular */
        tr {
            display: block;
            border: 1px solid var(--borde);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            position: relative;
        }

        td {
            display: block;
            padding: 5px 0;
            text-align: left !important;
            border: none;
        }

        /* Etiquetas simuladas para el celular */
        td::before {
            content: attr(data-label);
            display: block;
            font-size: 7pt;
            font-weight: bold;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .row-total { font-size: 1.2em; color: var(--rojo-epysur); }

        .btn-delete {
            position: absolute; top: 10px; right: 10px;
            background: #ff4d4d; color: white; border: none;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
        }

        /* --- TOTALES Y RESUMEN --- */
        .summary { 
            margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; 
        }
        .summary-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 10pt; }
        .total-row { border-top: 2px solid var(--rojo-epysur); color: var(--rojo-epysur); font-weight: bold; font-size: 16pt; padding-top: 10px; }

        .app-controls { 
            position: sticky; bottom: 0; background: rgba(255,255,255,0.9);
            padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd;
            margin: 0 -20px -20px -20px;
        }
        
        .btn {
            flex: 1; background: var(--rojo-epysur); color: white; padding: 12px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .btn-secondary { background: #444; }

        /* --- AJUSTES PARA PANTALLAS GRANDES (PC) --- */
        @media (min-width: 768px) {
            .page-container { padding: 40pt; margin: 20px; height: auto; }
            .header { flex-direction: row; align-items: flex-end; }
            .logo-img { height: 55pt; }
            .input-container-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; }
            
            /* Volver a formato tabla en PC */
            thead { display: table-header-group; }
            th { background: var(--rojo-epysur); color: white; padding: 10pt; font-size: 9pt; }
            tr { display: table-row; border: none; margin: 0; padding: 0; background: none; }
            td { display: table-cell; padding: 8pt; border-bottom: 1px solid var(--borde); }
            td::before { display: none; }
            .btn-delete { position: static; border-radius: 4px; width: auto; height: auto; padding: 5pt 8pt; }
            .summary { margin-left: auto; width: 220pt; }
            .app-controls { position: fixed; bottom: 20px; background: none; border: none; width: auto; }
        }

        /* --- AJUSTES PARA IMPRESIÓN --- */
        @media print {
            body { background: white; padding: 0; }
            .page-container { box-shadow: none; max-width: 100%; width: 100%; padding: 0; }
            .app-controls, .btn-add, .btn-delete { display: none !important; }
            thead { display: table-header-group !important; }
            tr { display: table-row !important; border: none; }
            td { display: table-cell !important; border-bottom: 1px solid #eee !important; }
            td::before { display: none !important; }
            .input-group input, .input-group textarea { border: none; background: transparent; padding: 2pt 0; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="header">
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">
                <h1>EPYSUR</h1>
                <p style="margin:0; font-size: 7pt; letter-spacing: 1px; color: #666;">SOLUCIONES PARA TU HOGAR</p>
            </div>
        </div>
        <div class="input-group" style="margin-left: auto;">
            <label>Cotización N°</label>
            <input type="text" id="n-cotizacion" placeholder="2026-001" style="font-weight: bold; color: var(--rojo-epysur); text-align: right;">
        </div>
    </div>

    <div class="input-container-grid">
        <div>
            <div class="input-group"><label>Nombre Cliente</label><input type="text" class="clearable"></div>
            <div class="input-group"><label>RUT</label><input type="text" class="clearable" oninput="formatearRut(this)"></div>
        </div>
        <div>
            <div class="input-group"><label>Fecha</label><input type="date" id="fecha"></div>
            <div class="input-group"><label>Dirección</label><input type="text" class="clearable"></div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="tabla-items">
            <thead>
                <tr>
                    <th style="width: 45%;">Descripción</th>
                    <th style="width: 15%;">Cant.</th>
                    <th style="width: 20%;">Unitario</th>
                    <th style="width: 20%;">Total</th>
                    <th style="width: 40px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td data-label="Descripción">
                        <textarea oninput="autoExpand(this)" placeholder="Ej: Mantención Caldera..." style="border:none; width:100%; background:transparent; resize:none;" class="clearable"></textarea>
                    </td>
                    <td data-label="Cantidad">
                        <input type="number" class="qty" value="1" oninput="calcular()">
                    </td>
                    <td data-label="Precio Unitario">
                        <input type="number" class="price" value="0" oninput="calcular()">
                    </td>
                    <td data-label="Subtotal Item" class="row-total" style="font-weight:bold; text-align:right;">$0</td>
                    <td><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-add" onclick="agregarFila()" style="width:100%; margin-top:15px; background:#eee; border:1px dashed #999; padding:12px; cursor:pointer; border-radius:8px; font-weight:bold;">+ AÑADIR OTRO ÍTEM</button>

    <div class="no-break">
        <div class="summary">
            <div class="summary-row"><span>Neto:</span><span id="res-neto">$0</span></div>
            <div class="summary-row"><span>IVA (19%):</span><span id="res-iva">$0</span></div>
            <div class="summary-row total-row"><span>TOTAL:</span><span id="res-total">$0</span></div>
        </div>

        <div style="margin-top:20px;">
            <div class="input-group"><label>Forma de Pago</label><input type="text" class="clearable" placeholder="Transferencia"></div>
            <div class="input-group"><label>Observaciones</label>
                <textarea oninput="autoExpand(this)" placeholder="Notas..." class="clearable"></textarea>
            </div>
        </div>
    </div>

    <div style="text-align:center; font-size:8pt; color:#aaa; margin-top:30px; padding-bottom:100px;">
        Cotización válida por 15 días.
    </div>
</div>

<div class="app-controls">
    <button class="btn btn-secondary" onclick="limpiarTodo()">LIMPIAR</button>
    <button class="btn" onclick="window.print()">DESCARGAR PDF</button>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    function autoExpand(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    function formatearRut(input) {
        let valor = input.value.replace(/\./g, '').replace(/-/g, '');
        if (valor.length < 2) return;
        let cuerpo = valor.slice(0, -1).slice(0, 8);
        let dv = valor.slice(-1).toUpperCase();
        input.value = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
    }

    function agregarFila() {
        const tbody = document.querySelector("#tabla-items tbody");
        const row = document.createElement("tr");
        row.innerHTML = `
            <td data-label="Descripción"><textarea oninput="autoExpand(this)" placeholder="..." style="border:none; width:100%; background:transparent; resize:none;" class="clearable"></textarea></td>
            <td data-label="Cantidad"><input type="number" class="qty" value="1" oninput="calcular()"></td>
            <td data-label="Precio Unitario"><input type="number" class="price" value="0" oninput="calcular()"></td>
            <td data-label="Subtotal Item" class="row-total" style="font-weight:bold; text-align:right;">$0</td>
            <td><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
        `;
        tbody.appendChild(row);
    }

    function eliminarFila(btn) {
        if (document.querySelectorAll("#tabla-items tbody tr").length > 1) {
            btn.closest('tr').remove();
            calcular();
        }
    }

    function calcular() {
        let neto = 0;
        document.querySelectorAll("#tabla-items tbody tr").forEach(r => {
            const q = parseFloat(r.querySelector(".qty").value) || 0;
            const p = parseFloat(r.querySelector(".price").value) || 0;
            const sub = Math.round(q * p);
            r.querySelector(".row-total").innerText = "$" + sub.toLocaleString('es-CL');
            neto += sub;
        });
        const iva = Math.round(neto * 0.19);
        document.getElementById("res-neto").innerText = "$" + neto.toLocaleString('es-CL');
        document.getElementById("res-iva").innerText = "$" + iva.toLocaleString('es-CL');
        document.getElementById("res-total").innerText = "$" + (neto + iva).toLocaleString('es-CL');
    }

    function limpiarTodo() {
        if (confirm("¿Limpiar todos los datos?")) {
            document.querySelectorAll('.clearable').forEach(el => el.value = '');
            document.getElementById('n-cotizacion').value = '';
            document.getElementById('fecha').valueAsDate = new Date();
            document.querySelector("#tabla-items tbody").innerHTML = `
                <tr>
                    <td data-label="Descripción"><textarea oninput="autoExpand(this)" placeholder="..." style="border:none; width:100%; background:transparent; resize:none;" class="clearable"></textarea></td>
                    <td data-label="Cantidad"><input type="number" class="qty" value="1" oninput="calcular()"></td>
                    <td data-label="Precio Unitario"><input type="number" class="price" value="0" oninput="calcular()"></td>
                    <td data-label="Subtotal Item" class="row-total" style="font-weight:bold; text-align:right;">$0</td>
                    <td><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
                </tr>
            `;
            calcular();
        }
    }
</script>
</body>
</html>
