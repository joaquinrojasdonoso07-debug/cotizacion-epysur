<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Epysur - Oficial</title>
    <style>
        /* Elimina encabezados y pies de página automáticos del navegador */
        @page {
            size: letter;
            margin: 0;
        }

        :root {
            --rojo-epysur: #A61F1F; /* Color basado en el logo de deshollinado[cite: 1, 3] */
            --gris-claro: #f8f8f8;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #555;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* Contenedor Tamaño Carta[cite: 3] */
        .page {
            width: 8.5in;
            min-height: 11in;
            background: white;
            padding: 50pt;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--rojo-epysur);
            padding-bottom: 15pt;
            margin-bottom: 25pt;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15pt;
        }

        .logo-img {
            height: 80pt; /* Ajuste para que el logo luzca profesional[cite: 3] */
            width: auto;
        }

        .logo-text h1 {
            color: var(--rojo-epysur);
            margin: 0;
            font-size: 28pt;
            font-weight: 900;
        }

        .doc-tag {
            background-color: var(--rojo-epysur);
            color: white;
            padding: 10pt 25pt;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14pt;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20pt;
            margin-bottom: 30pt;
        }

        .card {
            background: var(--gris-claro);
            padding: 12pt;
            border-radius: 5px;
        }

        .card label {
            display: block;
            font-size: 9pt;
            color: var(--rojo-epysur);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5pt;
        }

        input {
            width: 100%;
            border: none;
            background: transparent;
            border-bottom: 1px solid #ccc;
            padding: 3pt 0;
            font-size: 10pt;
            outline: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10pt;
        }

        th {
            background: var(--rojo-epysur);
            color: white;
            padding: 10pt;
            text-align: left;
            font-size: 9pt;
            text-transform: uppercase;
        }

        td {
            padding: 10pt;
            border-bottom: 1px solid #eee;
        }

        .summary {
            margin-left: auto;
            width: 220pt;
            margin-top: 30pt;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5pt 0;
        }

        .total-row {
            border-top: 2px solid var(--rojo-epysur);
            color: var(--rojo-epysur);
            font-weight: bold;
            font-size: 16pt;
            padding-top: 10pt;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 9pt;
            color: #777;
            border-top: 1px solid #eee;
            padding-top: 20pt;
        }

        /* Controles de la App (No se imprimen)[cite: 3] */
        .app-controls {
            position: fixed;
            bottom: 20pt;
            right: 20pt;
            display: flex;
            gap: 10pt;
        }

        .btn {
            background: var(--rojo-epysur);
            color: white;
            padding: 12pt 25pt;
            border: none;
            border-radius: 50pt;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4pt 12pt rgba(0,0,0,0.3);
        }

        @media print {
            body { background: white; }
            .page { box-shadow: none; margin: 0; }
            .app-controls, .btn-add { display: none !important; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div class="logo-container">
            <!-- Logo proporcionado por el usuario -->
            <img src="https://images.clothes.com/v1/mms/v2/71e06927-4c07-427f-9457-195971434c4f.jpg" alt="Logo Epysur" class="logo-img">
            <div class="logo-text">
                <h1>EPYSUR.CL</h1>
                <p style="margin:0; font-size: 10pt; color: #666; letter-spacing: 1px;">SOLUCIONES DE CALEFACCIÓN</p>
            </div>
        </div>
        <div class="doc-tag">Cotización</div>
    </div>

    <div style="text-align: right; margin-bottom: 20pt; font-weight: bold;">
        Fecha: <input type="date" id="fecha" style="width: 110pt; font-weight: bold; color: var(--rojo-epysur);">
    </div>

    <div class="grid-info">
        <div class="card">
            <label>Información del Cliente</label>
            <input type="text" placeholder="Nombre o Razón Social">
            <input type="text" placeholder="RUT" style="margin-top:8pt;">
        </div>
        <div class="card">
            <label>Ubicación del Servicio</label>
            <input type="text" placeholder="Dirección Completa">
            <input type="text" placeholder="Ciudad / Región" style="margin-top:8pt;">
        </div>
    </div>

    <table id="tabla-items">
        <thead>
            <tr>
                <th style="width: 40%;">Descripción</th>
                <th style="text-align:center;">Cant.</th>
                <th style="text-align:right;">Neto Unit.</th>
                <th style="text-align:right;">c/IVA Unit.</th>
                <th style="text-align:right;">Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" style="width:100%; border:none;" placeholder="Servicio o Producto..."></td>
                <td style="width:40pt;"><input type="number" class="qty" value="1" oninput="calcular()" style="text-align:center; border:none;"></td>
                <td style="width:70pt;"><input type="number" class="price" value="0" oninput="calcular()" style="text-align:right; border:none;"></td>
                <td class="unit-iva" style="text-align:right; color:#777;">$0</td>
                <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
            </tr>
        </tbody>
    </table>

    <button class="btn-add" onclick="agregarFila()" style="width:100%; margin-top:15pt; background:#eee; border:1px dashed #aaa; padding:10pt; cursor:pointer;">+ AGREGAR ITEM</button>

    <div class="summary">
        <div class="summary-row">
            <span>Neto:</span>
            <span id="res-neto">$0</span>
        </div>
        <div class="summary-row">
            <span>IVA (19%):</span>
            <span id="res-iva">$0</span>
        </div>
        <div class="summary-row total-row">
            <span>TOTAL:</span>
            <span id="res-total">$0</span>
        </div>
    </div>

    <div class="footer">
        <p>EPYSUR.CL - Mantenimiento y Deshollinado Profesional</p>
        <p>Documento informativo sin valor tributario. Válido por 15 días.</p>
    </div>
</div>

<div class="app-controls">
    <button class="btn" onclick="window.print()">GENERAR PDF / IMPRIMIR</button>
</div>

<script>
    // Setea la fecha actual automáticamente
    document.getElementById('fecha').valueAsDate = new Date();

    function agregarFila() {
        const table = document.getElementById("tabla-items").getElementsByTagName('tbody')[0];
        const row = table.insertRow();
        row.innerHTML = `
            <td><input type="text" style="width:100%; border:none;" placeholder="..."></td>
            <td><input type="number" class="qty" value="1" oninput="calcular()" style="text-align:center; border:none;"></td>
            <td><input type="number" class="price" value="0" oninput="calcular()" style="text-align:right; border:none;"></td>
            <td class="unit-iva" style="text-align:right; color:#777;">$0</td>
            <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
        `;
    }

    function calcular() {
        let netoAcumulado = 0;
        const rows = document.querySelectorAll("#tabla-items tbody tr");
        
        rows.forEach(r => {
            const q = parseFloat(r.querySelector(".qty").value) || 0;
            const p = parseFloat(r.querySelector(".price").value) || 0;
            
            const unitIva = Math.round(p * 1.19);
            const subtotal = q * p;
            
            r.querySelector(".unit-iva").innerText = "$" + unitIva.toLocaleString('es-CL');
            r.querySelector(".row-total").innerText = "$" + subtotal.toLocaleString('es-CL');
            
            netoAcumulado += subtotal;
        });

        const ivaTotal = Math.round(netoAcumulado * 0.19);
        const totalFinal = netoAcumulado + ivaTotal;

        document.getElementById("res-neto").innerText = "$" + netoAcumulado.toLocaleString('es-CL');
        document.getElementById("res-iva").innerText = "$" + ivaTotal.toLocaleString('es-CL');
        document.getElementById("res-total").innerText = "$" + totalFinal.toLocaleString('es-CL');
    }
</script>

</body>
</html>
