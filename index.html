<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Epysur - Profesional</title>
    <style>
        @page { size: letter; margin: 0; }
        :root { --rojo-epysur: #A61F1F; --gris-claro: #fcfcfc; --borde: #ddd; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #555;
            margin: 0; padding: 0;
            display: flex; justify-content: center;
        }

        .page {
            width: 100%; max-width: 8.5in;
            min-height: 11in;
            background: white;
            padding: 5vw;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }

        .header {
            display: flex; flex-direction: column;
            border-bottom: 3px solid var(--rojo-epysur);
            padding-bottom: 10pt; margin-bottom: 15pt;
        }

        @media (min-width: 600px) {
            .header { flex-direction: row; justify-content: space-between; align-items: flex-end; }
            .page { padding: 40pt; }
        }

        .logo-img { height: 55pt; width: auto; }
        .logo-text h1 { color: var(--rojo-epysur); margin: 0; font-size: 22pt; font-weight: 900; }
        
        .input-group { margin-bottom: 10pt; }
        .input-group label {
            display: block;
            font-size: 8pt;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 2pt;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            border: 1px solid #eee;
            background: var(--gris-claro);
            padding: 6pt;
            font-size: 10pt;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* ESTILO PARA 2 LÍNEAS EXACTAS */
        .obs-textarea {
            resize: none;
            height: 38pt; /* Altura suficiente para 2 líneas */
            line-height: 1.3;
            overflow: hidden; 
            display: block;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .info-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10pt;
            margin-bottom: 15pt;
        }

        @media (min-width: 600px) {
            .info-container { grid-template-columns: 1fr 1fr; }
        }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10pt; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; }
        th { background: var(--rojo-epysur); color: white; padding: 10pt; font-size: 9pt; text-align: left; }
        td { padding: 8pt; border-bottom: 1px solid #eee; }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5pt 8pt;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10pt;
        }

        .summary { margin-left: auto; width: 100%; max-width: 220pt; margin-top: 20pt; background: #f9f9f9; padding: 10pt; border-radius: 5px; }
        .summary-row { display: flex; justify-content: space-between; padding: 4pt 0; font-size: 10pt; }
        .total-row { border-top: 2px solid var(--rojo-epysur); color: var(--rojo-epysur); font-weight: bold; font-size: 15pt; padding-top: 8pt; }

        .condiciones-stack {
            margin-top: 20pt;
            border-top: 1px solid #eee;
            padding-top: 15pt;
            display: flex;
            flex-direction: column;
            gap: 5pt;
        }

        .app-controls { position: fixed; bottom: 15pt; width: 100%; display: flex; justify-content: center; z-index: 100; }
        .btn {
            background: var(--rojo-epysur); color: white; padding: 12pt 30pt;
            border: none; border-radius: 50pt; font-weight: bold; cursor: pointer;
            box-shadow: 0 4pt 15pt rgba(0,0,0,0.4);
        }

        @media print {
            body { background: white; }
            .page { box-shadow: none; width: 8.5in; padding: 40pt; }
            .app-controls, .btn-add, .btn-delete { display: none !important; }
            .input-group input, .input-group textarea { border: none; background: transparent; padding: 2pt 0; }
            .obs-textarea { height: auto; max-height: 38pt; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 10pt;">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">
                <h1>EPYSUR</h1>
                <p style="margin:0; font-size: 8pt; letter-spacing: 1px; color: #666;">SOLUCIONES PARA TU HOGAR</p>
            </div>
        </div>
        <div style="text-align: right;">
            <div class="input-group">
                <label>Cotización N°</label>
                <input type="text" placeholder="Ej: 2026-001" style="text-align: right; width: 150px; font-weight: bold; color: var(--rojo-epysur);">
            </div>
        </div>
    </div>

    <div class="info-container" style="grid-template-columns: 1fr 1fr;">
        <div class="input-group">
            <label>Teléfono de Contacto</label>
            <input type="text" id="telefono" placeholder="+56 9 1234 5678" oninput="formatearTelefono(this)">
        </div>
        <div class="input-group">
            <label>Fecha de Emisión</label>
            <input type="date" id="fecha">
        </div>
    </div>

    <div class="info-container">
        <div>
            <div class="input-group">
                <label>Nombre o Razón Social</label>
                <input type="text" placeholder="Nombre del cliente">
            </div>
            <div class="input-group">
                <label>RUT Cliente</label>
                <input type="text" id="rut" placeholder="12.345.678-9" oninput="formatearRut(this)">
            </div>
            <div class="input-group">
                <label>Atención a</label>
                <input type="text" placeholder="Sr(a). Juan Pérez">
            </div>
        </div>
        
        <div>
            <div class="input-group">
                <label>Dirección de Servicio</label>
                <input type="text" placeholder="Calle, número, depto">
            </div>
            <div class="input-group">
                <label>Comuna</label>
                <input type="text" placeholder="Ej: Temuco">
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="tabla-items">
            <thead>
                <tr>
                    <th style="width: 45%;">Descripción</th>
                    <th style="text-align:center; width: 10%;">Cant.</th>
                    <th style="text-align:right; width: 15%;">Neto Unit.</th>
                    <th style="text-align:right; width: 15%;">Total</th>
                    <th style="text-align:center; width: 5%;"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" placeholder="Descripción..." style="border:none; width:100%;"></td>
                    <td><input type="number" class="qty" value="1" step="any" oninput="calcular()" style="text-align:center; width: 100%;"></td>
                    <td><input type="number" class="price" value="0" step="any" oninput="calcular()" style="text-align:right; width: 100%;"></td>
                    <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
                    <td style="text-align:center;"><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-add" onclick="agregarFila()" style="width:100%; margin-top:10pt; background:#f0f0f0; border:1px dashed #999; padding:10pt; cursor:pointer; border-radius:5px; font-weight:bold;">+ AGREGAR ITEM</button>

    <div class="summary">
        <div class="summary-row"><span>Subtotal Neto:</span><span id="res-neto">$0</span></div>
        <div class="summary-row"><span>IVA (19%):</span><span id="res-iva">$0</span></div>
        <div class="summary-row total-row"><span>TOTAL:</span><span id="res-total">$0</span></div>
    </div>

    <div class="condiciones-stack">
        <div class="input-group"><label>Forma de Pago</label><input type="text" placeholder="Transferencia"></div>
        <div class="input-group">
            <label>Observaciones</label>
            <textarea id="observaciones" class="obs-textarea" placeholder="Detalles adicionales (máximo 2 líneas)"></textarea>
        </div>
        <div class="input-group"><label>Validez de la Cotización</label><input type="text" placeholder="15 días" style="font-weight: bold;"></div>
    </div>

    <div style="margin-top: auto; text-align: center; font-size: 8pt; color: #aaa; padding-top: 30pt;">
        Este documento es una cotización informativa y no representa una factura legal.
    </div>
</div>

<div class="app-controls">
    <button class="btn" onclick="window.print()">DESCARGAR PDF</button>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    // LÓGICA DE CONTROL ESTRICTO DE 2 LÍNEAS
    const obs = document.getElementById('observaciones');
    
    obs.addEventListener('keydown', function(e) {
        const lineas = this.value.split('\n');
        // Bloquear Enter si ya hay 2 líneas
        if (e.key === "Enter" && lineas.length >= 2) {
            e.preventDefault();
        }
    });

    obs.addEventListener('input', function() {
        const lineas = this.value.split('\n');
        
        // 1. Limitar saltos de línea manuales
        if (lineas.length > 2) {
            this.value = lineas.slice(0, 2).join('\n');
        }

        // 2. Limitar escritura si el texto desborda la altura (3ra línea por longitud)
        // Agregamos un margen de tolerancia de 2px
        if (this.scrollHeight > (this.clientHeight + 2)) {
            while (this.scrollHeight > (this.clientHeight + 2) && this.value.length > 0) {
                this.value = this.value.slice(0, -1);
            }
        }
    });

    function formatearRut(input) {
        let valor = input.value.replace(/\./g, '').replace(/-/g, '');
        if (valor.length < 2) return;
        let cuerpo = valor.slice(0, -1).slice(0, 8);
        let dv = valor.slice(-1).toUpperCase();
        input.value = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "-" + dv;
    }

    function formatearTelefono(input) {
        let num = input.value.replace(/\D/g, '');
        if (num.startsWith('56')) num = num.slice(2);
        if (num.length > 9) num = num.slice(0, 9);
        if (num.length > 0) {
            let formatted = "+56 ";
            if (num.length > 0) formatted += num.substring(0, 1) + " ";
            if (num.length > 1) formatted += num.substring(1, 5) + " ";
            if (num.length > 5) formatted += num.substring(5, 9);
            input.value = formatted.trim();
        }
    }

    function agregarFila() {
        const table = document.getElementById("tabla-items").getElementsByTagName('tbody')[0];
        const row = table.insertRow();
        row.innerHTML = `
            <td><input type="text" placeholder="..." style="border:none; width:100%;"></td>
            <td><input type="number" class="qty" value="1" step="any" oninput="calcular()" style="text-align:center; width: 100%;"></td>
            <td><input type="number" class="price" value="0" step="any" oninput="calcular()" style="text-align:right; width: 100%;"></td>
            <td class="row-total" style="text-align:right; font-weight:bold;">$0</td>
            <td style="text-align:center;"><button class="btn-delete" onclick="eliminarFila(this)">✕</button></td>
        `;
    }

    function eliminarFila(btn) {
        const row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
        calcular();
    }

    function calcular() {
        let netoAcumulado = 0;
        document.querySelectorAll("#tabla-items tbody tr").forEach(r => {
            const q = parseFloat(r.querySelector(".qty").value) || 0;
            const p = parseFloat(r.querySelector(".price").value) || 0;
            const subtotal = Math.round(q * p);
            r.querySelector(".row-total").innerText = "$" + subtotal.toLocaleString('es-CL');
            netoAcumulado += subtotal;
        });
        const ivaTotal = Math.round(netoAcumulado * 0.19);
        document.getElementById("res-neto").innerText = "$" + netoAcumulado.toLocaleString('es-CL');
        document.getElementById("res-iva").innerText = "$" + ivaTotal.toLocaleString('es-CL');
        document.getElementById("res-total").innerText = "$" + (netoAcumulado + ivaTotal).toLocaleString('es-CL');
    }
</script>
</body>
</html>
